<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhenlee AI Song</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #d4a373; --bg: #0d0d0d; --card: #1a1614; }
        body { background: var(--bg); color: #e5d3b3; font-family: 'Inter', sans-serif; margin: 0; }
        .content-section { display: none; padding: 25px 20px 120px; max-width: 500px; margin: auto; }
        .active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input, textarea, select { 
            background: #231f1c !important; border: 1px solid #3d332d !important; 
            color: white !important; width: 100%; padding: 12px; border-radius: 12px; outline: none;
        }
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(26, 22, 20, 0.95);
            backdrop-filter: blur(10px); display: flex; justify-content: space-around; 
            padding: 15px 0; border-top: 1px solid #2d2621; z-index: 100;
        }
        .nav-item { cursor: pointer; opacity: 0.4; text-align: center; font-size: 10px; }
        .nav-item.active { opacity: 1; color: var(--accent); }
        .type-btn { background: #231f1c; border: 1px solid #3d332d; padding: 10px; border-radius: 10px; flex: 1; text-align: center; font-size: 12px; }
        .type-btn.selected { border-color: var(--accent); color: var(--accent); background: rgba(212, 163, 115, 0.1); }
    </style>
</head>
<body>

    <section id="home" class="content-section active">
        <h1 class="text-3xl font-bold text-[#d4a373]">Dhenlee AI</h1>
        <div id="resultList" class="mt-8 space-y-5">
            <div class="text-center py-20 opacity-30 italic text-sm">Belum ada lagu.</div>
        </div>
    </section>

    <section id="generate" class="content-section">
        <h2 class="text-xl font-bold mb-6">Create Content</h2>
        
        <div class="flex gap-2 mb-6">
            <button onclick="setType('music')" id="btnMusic" class="type-btn selected">🎵 Musik</button>
            <button onclick="setType('sfx')" id="btnSfx" class="type-btn">🔊 Efek Suara</button>
        </div>

        <div id="formMusik" class="space-y-4">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-lg">🛠️</span>
                <span class="font-bold text-sm tracking-widest text-[#d4a373]">CUSTOM MODE</span>
            </div>

            <div>
                <label class="text-[10px] text-gray-500 font-bold block mb-1">SELECT MODEL</label>
                <select id="model">
                    <option value="chirp-v5.5">V5.5</option>
                    <option value="chirp-v5">V5</option>
                    <option value="chirp-v4.5-plus">V4.5+</option>
                    <option value="chirp-v4.5">V4.5</option>
                    <option value="chirp-v4">V4</option>
                    <option value="chirp-v4.5-all">V4.5 ALL</option>
                </select>
            </div>

            <input type="text" id="title" placeholder="Judul Lagu">
            <input type="text" id="style" placeholder="Gaya / Prompt Style (Contoh: Koplo, Reggae)">
            <textarea id="lyrics" rows="5" placeholder="Lirik Lagu (Kosongkan jika otomatis)"></textarea>
            
            <button onclick="startGenerate('music')" id="btnGenMusic" class="w-full bg-[#d4a373] text-black font-bold py-4 rounded-2xl mt-2">BUAT MUSIK</button>
        </div>

        <div id="formSfx" class="hidden space-y-4">
            <p class="text-xs opacity-60">Buat suara seperti ledakan, burung, atau suasana kantor.</p>
            <textarea id="sfxPrompt" rows="4" placeholder="Contoh: Suara ombak pantai di sore hari dengan kicauan burung..."></textarea>
            <button onclick="startGenerate('sfx')" id="btnGenSfx" class="w-full bg-blue-500 text-white font-bold py-4 rounded-2xl">BUAT EFEK SUARA</button>
        </div>

        <div id="statusBox" class="hidden mt-6 p-5 bg-[#1a1614] rounded-2xl border border-[#d4a373]/30 text-center">
            <p id="statusText" class="text-sm">Menghubungkan ke Suno...</p>
        </div>
    </section>

    <section id="settings" class="content-section">
        <h2 class="text-xl font-bold mb-6">Settings</h2>
        <div class="space-y-4">
            <input type="text" id="baseUrl" placeholder="Base URL (e.g. https://...)">
            <input type="password" id="apiKey" placeholder="API Key / Token (Optional)">
            <button onclick="saveSettings()" class="w-full bg-white/10 py-3 rounded-xl font-bold">SAVE CONFIG</button>
        </div>
    </section>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="tab('home', this)">🏠<br>Home</div>
        <div class="nav-item" onclick="tab('generate', this)">🎸<br>Generate</div>
        <div class="nav-item" onclick="tab('settings', this)">🛠️<br>Settings</div>
    </nav>

    <script>
        let currentType = 'music';

        function tab(id, el) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            el.classList.add('active');
        }

        function setType(type) {
            currentType = type;
            document.getElementById('formMusik').classList.toggle('hidden', type !== 'music');
            document.getElementById('formSfx').classList.toggle('hidden', type !== 'sfx');
            document.getElementById('btnMusic').classList.toggle('selected', type === 'music');
            document.getElementById('btnSfx').classList.toggle('selected', type === 'sfx');
        }

        function saveSettings() {
            const url = document.getElementById('baseUrl').value.trim();
            const key = document.getElementById('apiKey').value.trim();
            localStorage.setItem('suno_url', url.endsWith('/') ? url.slice(0, -1) : url);
            localStorage.setItem('suno_key', key);
            alert('Konfigurasi Disimpan!');
        }

        window.onload = () => {
            document.getElementById('baseUrl').value = localStorage.getItem('suno_url') || '';
            document.getElementById('apiKey').value = localStorage.getItem('suno_key') || '';
        }

        async function startGenerate(type) {
            const baseUrl = localStorage.getItem('suno_url');
            const key = localStorage.getItem('suno_key');
            if(!baseUrl) return alert('Atur Base URL dulu!');

            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            statusBox.classList.remove('hidden');
            statusText.innerText = "Suno sedang meracik nada...";

            let payload = {};
            if(type === 'music') {
                payload = {
                    prompt: document.getElementById('lyrics').value,
                    tags: document.getElementById('style').value,
                    title: document.getElementById('title').value,
                    model: document.getElementById('model').value,
                    make_instrumental: false
                };
            } else {
                payload = { prompt: document.getElementById('sfxPrompt').value, make_sfx: true };
            }

            try {
                const res = await fetch(`${baseUrl}/api/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                let tid = Array.isArray(data) ? data[0].id : (data.id || (data.data && data.data[0] ? data.data[0].id : null));

                if(tid) checkStatus(tid);
                else throw new Error("Gagal mendapatkan Task ID");
            } catch (err) {
                alert(err.message);
                statusBox.classList.add('hidden');
            }
        }

        async function checkStatus(id) {
            const baseUrl = localStorage.getItem('suno_url');
            const key = localStorage.getItem('suno_key');
            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${baseUrl}/api/get?ids=${id}`, {
                        headers: { 'Authorization': `Bearer ${key}` }
                    });
                    const data = await res.json();
                    const song = Array.isArray(data) ? data[0] : data;

                    if(song.audio_url) {
                        clearInterval(interval);
                        showSong(song);
                    }
                } catch (e) {}
            }, 7000);
        }

        function showSong(s) {
            const list = document.getElementById('resultList');
            if(list.innerHTML.includes('Belum ada')) list.innerHTML = '';
            list.innerHTML = `
                <div class="bg-[#1a1614] p-5 rounded-2xl border border-[#3d332d]">
                    <h4 class="font-bold text-[#d4a373] text-sm">${s.title || 'Karya AI'}</h4>
                    <audio controls class="w-full h-8 my-3"><source src="${s.audio_url}"></audio>
                    <a href="${s.audio_url}" download target="_blank" class="block bg-[#d4a373] text-black text-center py-2 rounded-xl text-xs font-bold">DOWNLOAD MP3</a>
                </div>
            ` + list.innerHTML;
            document.getElementById('statusBox').classList.add('hidden');
            tab('home', document.querySelectorAll('.nav-item')[0]);
        }
    </script>
</body>
</html>
